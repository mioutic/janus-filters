# Temporary: why does `gh release create` get HTTP 403 in the publish job since
# runner image 20260927? Removed again in the commit that fixes it.
name: release-debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: filters-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reports of run 37239893760
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: janus-filters-reports-37239893760
          path: build/reports
          run-id: 37239893760
          github-token: ${{ github.token }}
      - name: Probe the releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ls -la build/reports
          try() {
            local name="$1"; shift
            echo "=== ${name}"
            GH_DEBUG=api gh release create "debug-${name}-${GITHUB_RUN_ID}" --draft --target "${GITHUB_SHA}" \
              --title "Filters debug" "$@" 2>&1 | grep -E "^< HTTP/|HTTP 4|Resource|\"message\"" | head -5
            gh release delete "debug-${name}-${GITHUB_RUN_ID}" --yes >/dev/null 2>&1 || true
          }
          try plain --notes debug
          head -c 40000 build/reports/dropped.md > "${RUNNER_TEMP}/full.md"
          try dropped40k --notes-file "${RUNNER_TEMP}/full.md"
          head -c 4000 build/reports/dropped.md > "${RUNNER_TEMP}/small.md"
          try dropped4k --notes-file "${RUNNER_TEMP}/small.md"
          head -c 1000 build/reports/dropped.md > "${RUNNER_TEMP}/tiny.md"
          try dropped1k --notes-file "${RUNNER_TEMP}/tiny.md"
          echo "=== head of dropped.md"
          head -c 1000 build/reports/dropped.md
