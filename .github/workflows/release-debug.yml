# Temporary: why does `gh release create` get HTTP 403 in the publish job since
# runner image 20260927? Removed again in the commit that fixes it.
name: release-debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: filters-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Reports of run 37239893760
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: janus-filters-reports-37239893760
          path: build/reports
          run-id: 37239893760
          github-token: ${{ github.token }}
      - name: Probe the releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ls -la build/reports
          try() {
            local name="$1"; shift
            echo "=== ${name}"
            local tag="$1"; shift
            local target="$1"; shift
            GH_DEBUG=api gh release create "${tag}" --draft --target "${target}" \
              --title "Filters debug" "$@" 2>&1 | grep -E "^< HTTP/2|HTTP 4|Resource|\"message\"" | head -5
            gh release delete "${tag}" --yes >/dev/null 2>&1 || true
          }
          try plain "debug-plain-${GITHUB_RUN_ID}" "${GITHUB_SHA}" --notes debug
          try filtersname "filters-9999${GITHUB_RUN_ID: -6}" "${GITHUB_SHA}" --notes debug
          try oldsha "debug-oldsha-${GITHUB_RUN_ID}" 553a7c48c845085f77f77b4fd8e187358031c810 --notes debug
          try oldsha-full "debug-oldsha2-${GITHUB_RUN_ID}" "$(git rev-parse HEAD~5 2>/dev/null || echo none)" --notes debug
          git log --oneline -8 || true
